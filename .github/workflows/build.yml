name: Build OpenWrt

on:
  workflow_dispatch:
    inputs:
      branch:
        description: OpenWrt branch or tag
        default: openwrt-24.10
        required: true
      extra_config:
        description: Extra CONFIG lines (optional, use \n between lines)
        required: false
        default: ""

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3-setuptools rsync swig unzip zlib1g-dev \
            file wget libelf-dev

      - name: Clone OpenWrt
        env:
          BRANCH: ${{ inputs.branch }}
        run: git clone --depth 1 -b "$BRANCH" https://github.com/openwrt/openwrt.git openwrt

      - name: Update feeds
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Apply device support and configure
        env:
          EXTRA_CONFIG: ${{ inputs.extra_config }}
        run: |
          bash ./apply.sh ./openwrt --config
          if [ -n "$EXTRA_CONFIG" ]; then
            printf '%b\n' "$EXTRA_CONFIG" >> openwrt/.config
            make -C openwrt defconfig
          fi

      - name: Download sources
        working-directory: openwrt
        run: make download -j8

      - name: Build
        working-directory: openwrt
        run: make -j"$(nproc)" || make -j1 V=s

      - name: Collect images
        run: |
          mkdir -p out
          cp openwrt/bin/targets/ath79/generic/*h3c_wa4320-acn-h20-fit* out/
          cp openwrt/bin/targets/ath79/generic/sha256sums out/ || true
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: openwrt-h3c-wa4320-acn-h20-fit
          path: out/*
          if-no-files-found: error
